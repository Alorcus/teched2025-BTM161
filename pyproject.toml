[project]
name = "lg-coffee-mas"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "langgraph (>=0.6.8,<0.7.0)",
    "langgraph-swarm (>=0.0.14,<0.0.15)",
    "mlflow (>=3.4.0,<4.0.0)",
    "ollama (>=0.6.1,<0.7.0)",
    "langchain[ollama] (<1.0.0)",
    "langchain[anthropic] (<1.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "sqlmodel (>=0.0.24,<0.1.0)",
    "polars (>=1.40.1,<2.0.0)",
    "panel (>=1.4.0,<2.0.0)",
    "pm4py (>=2.7.22.2,<3.0.0.0)",
    "graphviz (>=0.21,<0.22)",
    "streamlit (>=1.57.0,<2.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "fastapi (>=0.118.0,<0.119.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "pydantic (>=2.11.0,<3.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[project.scripts]
simulate = "src.simulate:main"
dashboard = "src.dashboard.app:main"
reset-traces = "src.reset:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.12,<0.16.0"
pre-commit = ">=4.6.0,<5.0.0"
