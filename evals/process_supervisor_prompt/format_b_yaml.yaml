# Process: coffee_shop_order — compact catalog

# Each activity is one record. `triggers_by` is what the supervisor matches on.
# `terminates_with` is what kind of evidence ends the activity (only
# `terminal: true` activities can end with reason=terminal; all others end via
# handoff). Activities not listed below MUST be reported as Violation.

activities:
  - id: A01
    slug: identify_customer_request
    triggers_by: { agent: order_agent, kind: message }
    follows: [start]
    terminal: false

  - id: A02
    slug: create_order
    triggers_by: { agent: order_agent, kind: tool_call, tool: process_order }
    follows: [A01]
    terminal: false

  - id: A03
    slug: check_stock
    triggers_by: { agent: inventory_agent, kind: tool_call, tool: check_inventory }
    follows: [A02]
    terminal: false

  - id: A04
    slug: place_food_on_tray
    triggers_by: { agent: inventory_agent, kind: tool_call, tool: place_on_tray }
    follows: [A03]            # AND-split branch
    terminal: false

  - id: A05
    slug: brew_coffee
    triggers_by: { agent: barista_agent, kind: tool_call, tool: start_preparation }
    follows: [A03]            # AND-split branch
    terminal: false

  - id: A05b
    slug: brew_coffee
    triggers_by: { agent: barista_agent, kind: tool_call, tool: end_preparation }
    follows: [A05]
    terminal: false

  - id: A06
    slug: purchase_order
    triggers_by: { agent: order_agent, kind: tool_call, tool: calculate_total }
    follows: [A03]            # AND-split branch
    terminal: false

  - id: A07
    slug: handout_order
    triggers_by: { agent: order_agent, kind: message }
    follows: [A04, A05b, A06] # AND-join: needs all three
    terminal: true

  - id: A08
    slug: investigate_complaint
    triggers_by: { agent: customer_service_agent, kind: message }
    follows: [A01]            # XOR alternate branch from A01
    terminal: false

  - id: A09
    slug: offer_refund
    triggers_by: { agent: customer_service_agent, kind: tool_call, tool: offer_refund }
    follows: [A08]            # valid claim
    terminal: true

  - id: A09b
    slug: offer_refund
    triggers_by: { agent: customer_service_agent, kind: tool_call, tool: offer_partial_refund }
    follows: [A08]            # valid claim
    terminal: true

  - id: A10
    slug: reject_complaint
    triggers_by: { agent: customer_service_agent, kind: message }
    follows: [A08]            # default branch
    terminal: true

# Disambiguation for (agent, trigger=message, tool=null):
#   order_agent             → A01 unless any AND-split branch (A04/A05/A05b/A06) has fired, then A07.
#   customer_service_agent  → A08 unless A08 already fired, then A10.
#   inventory_agent / barista_agent → no such activity → Violation.

# Handoffs:
#   A `transfer_to_agent` tool call is NOT an activity. It terminates the
#   most recent open activity in the source agent's lane with reason
#   `via_handoff_to_<target_agent>`.

# Output format the supervisor MUST emit (one line, no prose):
#   Execution:<id>:<slug>
#   Termination:<id>:<slug>:<reason>          # reason=terminal or via_handoff_to_<agent>
#   Violation:<short_snake_case_reason>
