guardrails:
  - id: handover:allowed_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: Handover target must be in the calling agent's allowed_handovers list.
    predicate: allowed_handover_targets

  - id: calculate_total:discount_within_limit
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: Deny calculate_total invocations with discount_percent above 20%.
    predicate: discount_within_limit
    predicate_args:
      max_pct: 20
      effect: deny

  # Order lifecycle — each state-changing tool may only be called from the order
  # statuses listed in `allowed`. This replaces the former OrderStateMachine; the
  # transition graph is implicit in these per-tool source preconditions.
  - id: check_inventory:order_status
    type: hard
    version: v1
    tools:
      - check_inventory
    effect: deny
    description: check_inventory may only run while the order is pending.
    predicate: require_order_status
    predicate_args:
      allowed: [pending]
      effect: deny

  - id: update_stock:order_status
    type: hard
    version: v1
    tools:
      - update_stock
    effect: deny
    description: update_stock may only run once inventory is confirmed.
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed]
      effect: deny

  - id: start_preparation:order_status
    type: hard
    version: v1
    tools:
      - start_preparation
    effect: deny
    description: start_preparation needs a confirmed order (or a prior prep to retry).
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed, in_preparation, preparation_error]
      effect: deny

  - id: end_preparation:order_status
    type: hard
    version: v1
    tools:
      - end_preparation
    effect: deny
    description: end_preparation may only run while a coffee is in preparation.
    predicate: require_order_status
    predicate_args:
      allowed: [in_preparation]
      effect: deny

  - id: offer_refund:order_status
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: offer_refund may only run on a completed order.
    predicate: require_order_status
    predicate_args:
      allowed: [completed]
      effect: deny

  - id: assistant_message:on_menu_only
    type: soft
    version: v1
    tools:
      - assistant_message
    effect: deny
    description: >-
      LLM-as-judge that rejects any outgoing assistant message which
      recommends, offers, or otherwise proposes an item that is not on the
      coffee shop menu. Menu adherence is checked against the current MENU
      keys plus ALLOWED_EXTRAS (both injected into the judge prompt).
    judge_prompt: |
      You are a strict menu-adherence auditor for a coffee shop assistant.

      MENU (only these items are available):
      {menu}

      ALLOWED EXTRAS / MODIFIERS:
      {allowed_extras}

      Your task: read the assistant's OUTGOING message to the customer and
      decide whether it recommends, offers, suggests, promises, or otherwise
      proposes any drink, food, or menu item that is NOT on the MENU (with
      optional ALLOWED EXTRAS as modifiers).

      Rules:
      - The assistant MAY talk about menu items freely.
      - The assistant MAY politely decline items that are not on the menu
        (e.g. "we do not serve mocha"). Declining an off-menu item is not
        itself an off-menu recommendation.
      - The assistant MUST NOT invent, hallucinate, or upsell items that
        are not on the MENU. Examples of violations:
          * "How about a hazelnut latte?" (hazelnut is not an allowed extra)
          * "We recommend our caramel macchiato." (macchiato is not on the menu)
          * "You might enjoy a matcha frappé." (matcha, frappé — off menu)
      - Combinations of MENU items and ALLOWED EXTRAS are acceptable
        (e.g. "latte with oat milk", "americano with an extra shot").

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason mentioning the off-menu item(s)>"}}

      The reason will be shown to the assistant so it can revise. Keep it
      short (one sentence) and actionable.
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies:
      - conversation

  - id: process_order:items_on_menu
    type: hard
    version: v1
    tools:
      - process_order
    effect: deny
    description: Deterministic menu-adherence check on process_order; complements the soft assistant_message:on_menu_only judge.
    predicate: process_order_items_on_menu
    predicate_args:
      effect: deny

  - id: offer_partial_refund:below_order_total
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: deny
    description: Partial refund percent must not exceed 50% of the order total.
    predicate: refund_within_limit
    predicate_args:
      max_pct: 50
      effect: deny

  - id: transfer:context_summary_nonempty
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: Handovers must carry a non-trivial context_summary (>= 20 chars after strip).
    predicate: transfer_context_summary_nonempty
    predicate_args:
      min_chars: 20
      effect: deny

  - id: clean_machine:only_after_error
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: deny
    description: clean_machine only allowed when the most-recent order is in preparation_error or the last brew was contaminated.
    predicate: clean_machine_only_after_error
    predicate_args:
      effect: deny

  - id: handover:reason_matches_target
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: LLM-as-judge — the handover's context_summary must justify the chosen target_agent's scope.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system. Each specialist has a scope:
        - order_agent: takes new orders, prices them, calls process_order
        - inventory_agent: checks stock, updates stock, places food on tray
        - barista_agent: brews coffee (start/end_preparation, clean_machine)
        - customer_service_agent: handles complaints and refunds

      Calling agent: {agent_id}
      Proposed target: read from `target_agent` in tool_args below.

      Rule: DENY when the `context_summary` describes work that clearly does
      NOT belong to the target's scope (e.g. refund reason → barista_agent,
      brew failure → order_agent, new-order request → barista_agent).
      Ambiguous / mixed / procedural reasons: ALLOW.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<one sentence naming the mismatch>"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: assistant_message:no_price_promises
    type: soft
    version: v1
    tools:
      - assistant_message
    effect: deny
    description: LLM-as-judge — block messages that quote a specific dollar price without a preceding calculate_total / process_order result.
    judge_prompt: |
      You are auditing an outgoing assistant message in a coffee shop.

      Rule: the assistant may only quote a specific dollar amount (a price
      for a single item, or a total for an order) when that amount was
      produced by an earlier `calculate_total` or `process_order` tool
      result in this conversation. If the message quotes a specific dollar
      figure without such a tool call visible, DENY.

      Menu prices are shown below only for context — do NOT accept them as
      substitutes for a real tool call. The agent must actually run the
      tool before promising a number:
      {menu}

      Vague statements ("around five dollars", "roughly the same as a
      latte", "a couple of dollars each") are ALLOWED. So are non-price
      factual statements about the order.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<one sentence quoting the promised price>"}}
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies:
      - conversation

  # Strict-only extras.
  - id: process_order:max_calls
    type: hard
    version: v1
    tools:
      - process_order
    effect: deny
    description: process_order may be called at most once per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: process_order
      max_calls: 1
      effect: deny

  - id: process_order:size_within_range
    type: hard
    version: v1
    tools:
      - process_order
    effect: deny
    description: Order size must be between 1 and 8 units (summed quantities).
    predicate: order_size_within_range
    predicate_args:
      min_units: 1
      max_units: 8
      effect: deny

  - id: calculate_total:total_within_limit
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: Order total must not exceed $100.
    predicate: order_total_within_limit
    predicate_args:
      max_total: 100
      effect: deny

  # Predicate hard-codes Effect.FLAG on violation (see predicates.py). Deny
  # enforcement lives in the `include_order_id_in_handoff` guideline (and in
  # strict_flow_soft's soft_transfer:includes_order_id).
  - id: transfer:includes_order_id
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: Flag transfer_to_agent calls whose context_summary does not include an ORD#### order id.
    predicate: transfer_includes_order_id

  - id: offer_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: offer_refund may be called at most once per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_refund
      max_calls: 1
      effect: deny

  - id: offer_partial_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: deny
    description: offer_partial_refund may be called at most once per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_partial_refund
      max_calls: 1
      effect: deny

  - id: clean_machine:max_calls
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: deny
    description: clean_machine may be called at most twice per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: clean_machine
      max_calls: 2
      effect: deny
