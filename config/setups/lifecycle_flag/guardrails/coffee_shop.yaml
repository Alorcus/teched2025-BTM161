guardrails:
  - id: allowed_handover_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: Handover target must be in the calling agent's allowed_handovers list.
    predicate: allowed_handover_targets

  - id: discount_within_30pct
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: Flag (do not block) calculate_total invocations with discount_percent above the configured limit.
    predicate: discount_within_limit
    predicate_args:
      max_pct: 30

  - id: handover_appropriateness_soft_stub
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: allow
    description: Stub soft guardrail asking 'is this handover appropriate?' (always allow for MVP).
    judge_prompt: Is the proposed handover appropriate given conversation state and guidelines?
    state_dependencies:
      - conversation

  # Order lifecycle in OBSERVE mode: same source preconditions as baseline, but FLAG
  # (allow + label) instead of DENY — agents behave as if unconstrained while every
  # illegal transition is recorded in the guardrail log for comparison.
  - id: gate_check_inventory
    type: hard
    version: v1
    tools:
      - check_inventory
    effect: flag
    description: check_inventory may only run while the order is pending.
    predicate: require_order_status
    predicate_args:
      allowed: [pending]
      effect: flag

  - id: gate_update_stock
    type: hard
    version: v1
    tools:
      - update_stock
    effect: flag
    description: update_stock may only run once inventory is confirmed.
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed]
      effect: flag

  - id: gate_start_preparation
    type: hard
    version: v1
    tools:
      - start_preparation
    effect: flag
    description: start_preparation needs a confirmed order (or a prior prep to retry).
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed, in_preparation, preparation_error]
      effect: flag

  - id: gate_end_preparation
    type: hard
    version: v1
    tools:
      - end_preparation
    effect: flag
    description: end_preparation may only run while a coffee is in preparation.
    predicate: require_order_status
    predicate_args:
      allowed: [in_preparation]
      effect: flag

  - id: gate_offer_refund
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: flag
    description: offer_refund may only run on a completed order.
    predicate: require_order_status
    predicate_args:
      allowed: [completed]
      effect: flag
