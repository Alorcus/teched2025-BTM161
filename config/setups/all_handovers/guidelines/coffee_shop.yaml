guidelines:
  - id: handoff_etiquette
    version: v1
    prompt: |
      When you hand off to another agent, always provide a context_summary
      and an explicit expectation. The next agent only sees a synthetic briefing
      built from these two fields plus the messages after the handoff boundary.

  - id: handoff_order_id
    version: v1
    prompt: |
      When you hand off to another agent, if the conversation involves a concrete order,
      you MUST include the order_id in the context_summary, structured like this: ORDXXXX. This allows the next agent 
      to retrieve the full order details using get_order(order_id) and provide better assistance.