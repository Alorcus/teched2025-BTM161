guardrails:
  - id: allowed_handover_targets
    type: hard
    version: v1
    tools: [transfer_to_agent]
    effect: deny
    description: Handover target must be in the calling agent's allowed_handovers list.
    predicate: allowed_handover_targets

  - id: handover_appropriateness_soft_stub
    type: soft
    version: v1
    tools: [transfer_to_agent]
    effect: allow
    description: Stub soft guardrail asking 'is this handover appropriate?' (always allow for MVP).
    judge_prompt: Is the proposed handover appropriate given conversation state and guidelines?
    state_dependencies: [conversation]

  # Ridiculously overconstrained (deny): magnitude dials cranked so far that normal
  # orders cannot even be created. Only a single sub-$3 coffee gets through; no
  # discounts, no partial refunds.
  - id: order_size_max1
    type: hard
    version: v1
    tools: [process_order]
    effect: deny
    description: At most ONE unit per order.
    predicate: order_size_within_range
    predicate_args: {min_units: 1, max_units: 1, effect: deny}

  - id: order_total_max3
    type: hard
    version: v1
    tools: [calculate_total]
    effect: deny
    description: Order total must not exceed $3.
    predicate: order_total_within_limit
    predicate_args: {max_total: 3.0, effect: deny}

  - id: discount_zero
    type: hard
    version: v1
    tools: [calculate_total]
    effect: deny
    description: No discounts allowed at all.
    predicate: discount_within_limit
    predicate_args: {max_pct: 0, effect: deny}

  - id: refund_zero
    type: hard
    version: v1
    tools: [offer_partial_refund]
    effect: deny
    description: No partial refunds allowed at all.
    predicate: refund_within_limit
    predicate_args: {max_pct: 0, effect: deny}

  # Order lifecycle (deny) — normal source preconditions.
  - id: gate_check_inventory
    type: hard
    version: v1
    tools: [check_inventory]
    effect: deny
    description: check_inventory may only run while the order is pending.
    predicate: require_order_status
    predicate_args: {allowed: [pending], effect: deny}

  - id: gate_update_stock
    type: hard
    version: v1
    tools: [update_stock]
    effect: deny
    description: update_stock may only run once inventory is confirmed.
    predicate: require_order_status
    predicate_args: {allowed: [inventory_confirmed], effect: deny}

  - id: gate_start_preparation
    type: hard
    version: v1
    tools: [start_preparation]
    effect: deny
    description: start_preparation needs a confirmed order (or a prior prep to retry).
    predicate: require_order_status
    predicate_args: {allowed: [inventory_confirmed, in_preparation, preparation_error], effect: deny}

  - id: gate_end_preparation
    type: hard
    version: v1
    tools: [end_preparation]
    effect: deny
    description: end_preparation may only run while a coffee is in preparation.
    predicate: require_order_status
    predicate_args: {allowed: [in_preparation], effect: deny}

  - id: gate_offer_refund
    type: hard
    version: v1
    tools: [offer_refund]
    effect: deny
    description: offer_refund may only run on a completed order.
    predicate: require_order_status
    predicate_args: {allowed: [completed], effect: deny}

  - id: place_on_tray_item_in_order
    type: hard
    version: v1
    tools: [place_on_tray]
    effect: deny
    description: place_on_tray may only run for items that are part of the order.
    predicate: item_in_order

  - id: gate_place_on_tray
    type: hard
    version: v1
    tools: [place_on_tray]
    effect: deny
    description: place_on_tray may only run after stock is updated.
    predicate: require_order_status
    predicate_args: {allowed: [inventory_confirmed, in_preparation], effect: deny}
