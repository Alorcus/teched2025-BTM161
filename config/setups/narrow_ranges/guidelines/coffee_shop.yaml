guidelines:
  - id: provide_handoff_context
    version: v1
    prompt: |
      When you hand off to another agent, always provide a context_summary
      and an explicit expectation. The next agent only sees a synthetic briefing
      built from these two fields plus the messages after the handoff boundary.

  - id: include_order_id_in_handoff
    version: v1
    prompt: |
      If an order has been placed, always include the order ID in the handoff
      context_summary. The next agent will need this to look up the order.
      If a concrete order ID was at all part of the conversation, you MUST include it in the handoff context_summary.
      If the order ID is not known, you MUST specify that there is no Order ID available.

  - id: refuse_refund_without_order_id
    version: v1
    prompt: |
      If the customer requests a refund, you MUST ask for the order ID if it is not already known.
      If the customer does not know the order ID you cannot process a refund. Convince the customer to provide the order ID or to end the conversation.

  - id: omit_order_id_on_new_order
    version: v1
    prompt: |
      If the customer wants to place a new order, let the order agent know specifically that they need to process a new order.
      The order agent should then follow the normal order-taking workflow.
      Do not include an order ID in the handoff context_summary, since this is a new order.

  - id: summarize_before_handoff
    version: v1
    prompt: |
      Before you hand off to another agent, briefly restate the customer's
      original ask in your own words. The next agent should be able to pick
      up the conversation without re-asking the customer to explain what
      they wanted. Keep the restatement short — one or two sentences.

  - id: offer_alternatives_when_blocked
    version: v1
    prompt: |
      If a tool call is denied by a guardrail, do not simply apologize and
      stop. Look at what the customer wanted and offer the closest allowed
      alternative — a smaller order, a different item, a different action
      on your part. Only escalate or refuse outright if no alternative
      exists.

  - id: confirm_before_committing
    version: v1
    prompt: |
      Before you call an order-mutating tool (process_order, offer_refund,
      offer_partial_refund), briefly confirm the specifics with the customer
      in natural language first: what item(s), what size, what refund amount.
      Do not read out the confirmation as a tool call — just check with the
      customer that you have it right before you commit.

  - id: ask_one_question_at_a_time
    version: v1
    prompt: |
      When you need to clarify something with the customer, ask a single
      focused question and wait for their answer. Do not stack multiple
      questions in one message (size AND milk AND food) — that overwhelms
      the customer and produces partial answers you then have to untangle.
