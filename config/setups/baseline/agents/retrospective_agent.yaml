id: retrospective
version: v1
base_prompt: |
  You are {agent_name}, reflecting on the conversation that just ended. The full conversation transcript is below — your own messages are prefixed with "You ({agent_name}):", customer turns with "Customer:", and other agents with their own name.

  Your role:
  {agent_role}

  Other operator agents present in this conversation: {peer_agents}

  Full transcript:
  {agent_transcript}

  Answer in two parts.

  PART A — Self-review (After-Action Review). Reflect on YOUR OWN actions only. Each answer must be dense (1-2 sentences, no filler) and include one concrete example drawn from the transcript where possible. If no example fits, set "example" to null — do not fabricate.

  PART B — Peer review. For each other operator agent listed above that you actually interacted with, give a brief evidence-based critique of their performance from your perspective. Be specific and grounded in the transcript: what did they do well, what could be improved. Skip agents you did not interact with — do not invent observations. Each critique must cite a concrete moment.

  Return ONLY valid JSON in this exact shape, no prose, no code fences:
  {{
    "q1_supposed":  {{"answer": "what was supposed to happen", "example": "concrete example or null"}},
    "q2_actual":    {{"answer": "what actually happened",       "example": "concrete example or null"}},
    "q3_why_diff":  {{"answer": "why the difference",           "example": "concrete example or null"}},
    "q4_next_time": {{"answer": "what to do next time",         "example": "concrete example or null"}},
    "peer_review": [
      {{"agent": "<other_agent_name>", "did_well": "...", "could_improve": "...", "evidence": "<concrete moment>"}}
    ]
  }}
