# strict_flow_soft: every strict_flow rule expressed here as either a soft
# (LLM-as-judge) guardrail at `effect: deny`, or (for rules already soft in
# strict_flow) kept verbatim. Original hard rules stay as observability
# shadows at `effect: flag`; soft judges are the enforcers. Same shape as
# baseline_soft.
#
# The three max_tool_calls-family extras (offer_refund/offer_partial_refund/
# clean_machine max_calls) have no soft counterparts — counters are
# deterministic; the hard shadow is their only enforcement path here.
guardrails:
  # -----------------------------------------------------------------------
  # NATIVE SOFT RULES — kept verbatim from strict_flow at effect: deny.
  # -----------------------------------------------------------------------
  - id: assistant_message:on_menu_only
    type: soft
    version: v1
    tools:
      - assistant_message
    effect: deny
    description: >-
      LLM-as-judge that rejects any outgoing assistant message which
      recommends, offers, or otherwise proposes an item that is not on the
      coffee shop menu. Menu adherence is checked against the current MENU
      keys plus ALLOWED_EXTRAS (both injected into the judge prompt).
    judge_prompt: |
      You are a strict menu-adherence auditor for a coffee shop assistant.

      MENU (only these items are available):
      {menu}

      ALLOWED EXTRAS / MODIFIERS:
      {allowed_extras}

      Your task: read the assistant's OUTGOING message to the customer and
      decide whether it recommends, offers, suggests, promises, or otherwise
      proposes any drink, food, or menu item that is NOT on the MENU (with
      optional ALLOWED EXTRAS as modifiers).

      Rules:
      - The assistant MAY talk about menu items freely.
      - The assistant MAY politely decline items that are not on the menu
        (e.g. "we do not serve mocha"). Declining an off-menu item is not
        itself an off-menu recommendation.
      - The assistant MUST NOT invent, hallucinate, or upsell items that
        are not on the MENU. Examples of violations:
          * "How about a hazelnut latte?" (hazelnut is not an allowed extra)
          * "We recommend our caramel macchiato." (macchiato is not on the menu)
          * "You might enjoy a matcha frappé." (matcha, frappé — off menu)
      - Combinations of MENU items and ALLOWED EXTRAS are acceptable
        (e.g. "latte with oat milk", "americano with an extra shot").

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason mentioning the off-menu item(s)>"}}

      The reason will be shown to the assistant so it can revise. Keep it
      short (one sentence) and actionable.
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies:
      - conversation

  - id: handover:reason_matches_target
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: LLM-as-judge — the handover's context_summary must justify the chosen target_agent's scope.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system. Each specialist has a scope:
        - order_agent: takes new orders, prices them, calls process_order
        - inventory_agent: checks stock, updates stock, places food on tray
        - barista_agent: brews coffee (start/end_preparation, clean_machine)
        - customer_service_agent: handles complaints and refunds

      Calling agent: {agent_id}
      Proposed target: read from `target_agent` in tool_args below.

      Rule: DENY when the `context_summary` describes work that clearly does
      NOT belong to the target's scope (e.g. refund reason → barista_agent,
      brew failure → order_agent, new-order request → barista_agent).
      Ambiguous / mixed / procedural reasons: ALLOW.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<one sentence naming the mismatch>"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: assistant_message:no_price_promises
    type: soft
    version: v1
    tools:
      - assistant_message
    effect: deny
    description: LLM-as-judge — block messages that quote a specific dollar price without a preceding calculate_total / process_order result.
    judge_prompt: |
      You are auditing an outgoing assistant message in a coffee shop.

      Rule: the assistant may only quote a specific dollar amount (a price
      for a single item, or a total for an order) when that amount was
      produced by an earlier `calculate_total` or `process_order` tool
      result in this conversation. If the message quotes a specific dollar
      figure without such a tool call visible, DENY.

      Menu prices are shown below only for context — do NOT accept them as
      substitutes for a real tool call. The agent must actually run the
      tool before promising a number:
      {menu}

      Vague statements ("around five dollars", "roughly the same as a
      latte", "a couple of dollars each") are ALLOWED. So are non-price
      factual statements about the order.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<one sentence quoting the promised price>"}}
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies:
      - conversation

  # -----------------------------------------------------------------------
  # HARD SHADOWS — every strict_flow hard rule kept, forced to `effect: flag`.
  # -----------------------------------------------------------------------
  - id: handover:allowed_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: allowed_handover_targets
    predicate_args:
      effect: flag

  - id: calculate_total:discount_within_limit
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: discount_within_limit
    predicate_args:
      max_pct: 20
      effect: flag

  - id: check_inventory:order_status
    type: hard
    version: v1
    tools:
      - check_inventory
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [pending]
      effect: flag

  - id: update_stock:order_status
    type: hard
    version: v1
    tools:
      - update_stock
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed]
      effect: flag

  - id: start_preparation:order_status
    type: hard
    version: v1
    tools:
      - start_preparation
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed, in_preparation, preparation_error]
      effect: flag

  - id: end_preparation:order_status
    type: hard
    version: v1
    tools:
      - end_preparation
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [in_preparation]
      effect: flag

  - id: offer_refund:order_status
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [completed]
      effect: flag

  - id: process_order:items_on_menu
    type: hard
    version: v1
    tools:
      - process_order
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: process_order_items_on_menu
    predicate_args:
      effect: flag

  - id: offer_partial_refund:within_policy_cap
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: refund_within_limit
    predicate_args:
      max_pct: 50
      effect: flag

  - id: transfer:context_summary_nonempty
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: transfer_context_summary_nonempty
    predicate_args:
      min_chars: 20
      effect: flag

  - id: clean_machine:only_after_error
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: clean_machine_only_after_error
    predicate_args:
      effect: flag

  - id: process_order:max_calls
    type: hard
    version: v1
    tools:
      - process_order
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: max_tool_calls
    predicate_args:
      tool_name: process_order
      max_calls: 1
      effect: flag

  - id: process_order:size_within_range
    type: hard
    version: v1
    tools:
      - process_order
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: order_size_within_range
    predicate_args:
      min_units: 1
      max_units: 8
      effect: flag

  - id: calculate_total:total_within_limit
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: order_total_within_limit
    predicate_args:
      max_total: 100
      effect: flag

  # Predicate hard-codes Effect.FLAG; enforcement at deny lives in
  # soft_transfer:includes_order_id below.
  - id: transfer:includes_order_id
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: transfer_includes_order_id

  # max_tool_calls shadows. No soft counterparts (see file header).
  - id: offer_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: flag
    description: strict_flow shadow (flag only). No soft counterpart.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_refund
      max_calls: 1
      effect: flag

  - id: offer_partial_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: flag
    description: strict_flow shadow (flag only). No soft counterpart.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_partial_refund
      max_calls: 1
      effect: flag

  - id: clean_machine:max_calls
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: flag
    description: strict_flow shadow (flag only). No soft counterpart.
    predicate: max_tool_calls
    predicate_args:
      tool_name: clean_machine
      max_calls: 2
      effect: flag

  # -----------------------------------------------------------------------
  # SOFT COUNTERPARTS — LLM-as-judge reimplementations. All deny.
  # -----------------------------------------------------------------------
  - id: soft_handover:allowed_targets
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: >-
      LLM-as-judge counterpart to `handover:allowed_targets`. Rejects a
      handover whose `target_agent` is not in the calling agent's declared
      `allowed_handovers` list.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system.

      Calling agent: {agent_id}
      Agents that {agent_id} is allowed to hand off to: {allowed_handovers}

      Rules:
      - A handover is ALLOWED if and only if the proposed `target_agent`
        appears verbatim in the allowed list above.
      - If the allowed list is "(none)" the handover MUST be denied.
      - Be strict: do not accept fuzzy matches, aliases, or agents that
        merely sound similar. Exact string match only.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason naming the target and the allowed list>"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_calculate_total:discount_within_limit
    type: soft
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: LLM-as-judge counterpart to calculate_total:discount_within_limit (strict 20% cap).
    judge_prompt: |
      You are auditing a discount applied to an order total.

      Rule: the maximum permitted discount is 20 percent. If the
      `discount_percent` field in the tool call exceeds 20, the call
      violates policy.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the discount_percent value>"}}
    user_template: |
      calculate_total tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_check_inventory:order_status
    type: soft
    version: v1
    tools:
      - check_inventory
    effect: deny
    description: >-
      LLM-as-judge counterpart to `check_inventory:order_status`. Only allow
      `check_inventory` when the order is currently in status `pending`.
    judge_prompt: |
      You are auditing an inventory-check tool call in a coffee shop order
      lifecycle.

      Rule: `check_inventory` may ONLY be called while the target order's
      current status is exactly "pending". Any other status (including
      empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      check_inventory tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_update_stock:order_status
    type: soft
    version: v1
    tools:
      - update_stock
    effect: deny
    description: >-
      LLM-as-judge counterpart to `update_stock:order_status`. Only allow
      `update_stock` when the order status is `inventory_confirmed`.
    judge_prompt: |
      You are auditing a stock-update tool call in a coffee shop order
      lifecycle.

      Rule: `update_stock` may ONLY be called while the target order's
      current status is exactly "inventory_confirmed". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      update_stock tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_start_preparation:order_status
    type: soft
    version: v1
    tools:
      - start_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `start_preparation:order_status`. Allow
      `start_preparation` only when the order status is one of:
      inventory_confirmed, in_preparation, or preparation_error (the latter
      two support retries of a failed brew).
    judge_prompt: |
      You are auditing a brew-start tool call in a coffee shop order
      lifecycle.

      Rule: `start_preparation` may ONLY be called while the target
      order's current status is one of:
        - "inventory_confirmed"
        - "in_preparation"
        - "preparation_error"
      Any other status (including empty / unknown / missing) means the
      call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      start_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_end_preparation:order_status
    type: soft
    version: v1
    tools:
      - end_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `end_preparation:order_status`. Only allow
      `end_preparation` when the order status is `in_preparation`.
    judge_prompt: |
      You are auditing a brew-completion tool call in a coffee shop order
      lifecycle.

      Rule: `end_preparation` may ONLY be called while the target order's
      current status is exactly "in_preparation". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      end_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_offer_refund:order_status
    type: soft
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: >-
      LLM-as-judge counterpart to `offer_refund:order_status`. Only allow
      `offer_refund` when the order status is `completed`.
    judge_prompt: |
      You are auditing a refund tool call in a coffee shop order
      lifecycle.

      Rule: `offer_refund` may ONLY be called while the target order's
      current status is exactly "completed". Any other status (including
      empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      offer_refund tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_process_order:items_on_menu
    type: soft
    version: v1
    tools:
      - process_order
    effect: deny
    description: LLM-as-judge counterpart to process_order:items_on_menu.
    judge_prompt: |
      You are auditing a process_order tool call in a coffee shop.

      MENU (only these items are on offer, keys shown lowercased):
      {menu}

      Rule: every item's `name` in `tool_args.order` must resolve (after
      lowercasing and trimming) to a MENU key. If ANY item is off-menu,
      DENY. If the order list is missing or malformed, ALLOW (the tool
      itself validates the payload).

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason naming the off-menu item(s)>"}}
    user_template: |
      process_order tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_offer_partial_refund:within_policy_cap
    type: soft
    version: v1
    tools:
      - offer_partial_refund
    effect: deny
    description: LLM-as-judge counterpart to offer_partial_refund:within_policy_cap (strict 50% cap).
    judge_prompt: |
      You are auditing a partial-refund tool call in a coffee shop.

      Rule: the `refund_percent` field must not exceed 50. Partial refunds
      above 50% of the order total are not allowed under this policy. If
      `refund_percent` > 50 (or is negative), DENY.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the refund_percent value>"}}
    user_template: |
      offer_partial_refund tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_transfer:context_summary_nonempty
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: LLM-as-judge counterpart to transfer:context_summary_nonempty.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee shop.

      Rule: `context_summary` must be non-empty and carry at least a full
      sentence of substance (a rough guide: 20+ characters after trimming,
      or a real short sentence describing what the next agent should do).
      DENY when it's empty, whitespace, or a bare filler like "handoff",
      "see conversation", "please help".

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the trivial context_summary>"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_clean_machine:only_after_error
    type: soft
    version: v1
    tools:
      - clean_machine
    effect: deny
    description: LLM-as-judge counterpart to clean_machine:only_after_error.
    judge_prompt: |
      You are auditing a clean_machine tool call in a coffee shop.

      Rule: `clean_machine` may ONLY be called when the current order's
      status is exactly "preparation_error" (i.e. the last brew failed and
      the machine needs cleaning before a retry). Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      clean_machine tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_process_order:max_calls
    type: soft
    version: v1
    tools:
      - process_order
    effect: deny
    description: >-
      LLM-as-judge counterpart to `process_order:max_calls`. Denies a
      second (or later) call to `process_order` within the same
      conversation.
    judge_prompt: |
      You are auditing a `process_order` tool call in a coffee shop
      multi-agent system.

      Rule: `process_order` may be called at most ONCE per conversation.
      If the conversation transcript already contains a prior successful
      call to `process_order`, this call MUST be denied.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason: prior process_order call at ...>"}}
    user_template: |
      process_order tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_process_order:size_within_range
    type: soft
    version: v1
    tools:
      - process_order
    effect: deny
    description: LLM-as-judge counterpart to process_order:size_within_range.
    judge_prompt: |
      You are auditing a `process_order` tool call in a coffee shop.

      Rule: the total unit count (sum of `quantity` fields across all
      items in `tool_args.order`) must be between 1 and 8 inclusive. If
      the sum is 0, or greater than 8, DENY. If the order list is
      missing or malformed, ALLOW (the tool itself validates the payload).

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the summed quantity>"}}
    user_template: |
      process_order tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_calculate_total:total_within_limit
    type: soft
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: LLM-as-judge counterpart to calculate_total:total_within_limit.
    judge_prompt: |
      You are auditing a `calculate_total` tool call in a coffee shop.

      Rule: the order subtotal implied by the tool call (after any
      discount, if `discount_percent` is present) must not exceed $100.
      If `tool_args` implies a total above $100, DENY. If it cannot be
      determined from the args alone, ALLOW (the deterministic
      calculate_total:total_within_limit shadow will still catch real
      violations).

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the implied total>"}}
    user_template: |
      calculate_total tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_transfer:includes_order_id
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: LLM-as-judge counterpart to transfer:includes_order_id (deny-strength enforcer; the paired hard predicate is FLAG-only).
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee shop.

      Rule: the `context_summary` in the tool call must include an order
      id matching the pattern `ORD\d+` (e.g. ORD1234). If no such id
      appears AND the conversation contains at least one placed order,
      DENY. If no order has been placed yet in this conversation, ALLOW
      (there is nothing to reference yet).

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason: context_summary missing ORDxxxx>"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation
