# strict_flow_soft: every hard guardrail from `strict_flow` is reimplemented as a
# soft (LLM-as-judge) guardrail with the same effect intent. The original hard
# rules are kept as observability shadows — flipped to `effect: flag` so they
# still evaluate and log, but the soft judges are the ones that actually block.
# Same shape as baseline_soft, extended with the strict_flow-specific
# process_order:max_calls rule.
guardrails:
  # -----------------------------------------------------------------------
  # HARD SHADOWS — every strict_flow hard rule kept, forced to `effect: flag`.
  # -----------------------------------------------------------------------
  - id: handover:allowed_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: strict_flow hard rule kept as observability shadow (flag-only). Enforcement moves to soft_handover:allowed_targets.
    predicate: allowed_handover_targets
    predicate_args:
      effect: flag

  - id: calculate_total:discount_within_limit
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: Flag (do not block) calculate_total invocations with discount_percent above the configured limit. Mirrors strict_flow.
    predicate: discount_within_limit
    predicate_args:
      max_pct: 30

  - id: check_inventory:order_status
    type: hard
    version: v1
    tools:
      - check_inventory
    effect: flag
    description: strict_flow shadow — flag only. Enforcement moves to soft_check_inventory:order_status.
    predicate: require_order_status
    predicate_args:
      allowed: [pending]
      effect: flag

  - id: update_stock:order_status
    type: hard
    version: v1
    tools:
      - update_stock
    effect: flag
    description: strict_flow shadow — flag only. Enforcement moves to soft_update_stock:order_status.
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed]
      effect: flag

  - id: start_preparation:order_status
    type: hard
    version: v1
    tools:
      - start_preparation
    effect: flag
    description: strict_flow shadow — flag only. Enforcement moves to soft_start_preparation:order_status.
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed, in_preparation, preparation_error]
      effect: flag

  - id: end_preparation:order_status
    type: hard
    version: v1
    tools:
      - end_preparation
    effect: flag
    description: strict_flow shadow — flag only. Enforcement moves to soft_end_preparation:order_status.
    predicate: require_order_status
    predicate_args:
      allowed: [in_preparation]
      effect: flag

  - id: offer_refund:order_status
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: flag
    description: strict_flow shadow — flag only. Enforcement moves to soft_offer_refund:order_status.
    predicate: require_order_status
    predicate_args:
      allowed: [completed]
      effect: flag

  - id: process_order:max_calls
    type: hard
    version: v1
    tools:
      - process_order
    effect: flag
    description: strict_flow shadow — flag only. Enforcement moves to soft_process_order:max_calls.
    predicate: max_tool_calls
    predicate_args:
      tool_name: process_order
      max_calls: 1
      effect: flag

  # -----------------------------------------------------------------------
  # SOFT COUNTERPARTS — LLM-as-judge reimplementations of every strict_flow
  # hard rule. All deny (strict_flow denies everything).
  # -----------------------------------------------------------------------
  - id: soft_handover:allowed_targets
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: >-
      LLM-as-judge counterpart to `handover:allowed_targets`. Rejects a
      handover whose `target_agent` is not in the calling agent's declared
      `allowed_handovers` list.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system.

      Calling agent: {agent_id}
      Agents that {agent_id} is allowed to hand off to: {allowed_handovers}

      Rules:
      - A handover is ALLOWED if and only if the proposed `target_agent`
        appears verbatim in the allowed list above.
      - If the allowed list is "(none)" the handover MUST be denied.
      - Be strict: do not accept fuzzy matches, aliases, or agents that
        merely sound similar. Exact string match only.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason naming the target and the allowed list>"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_calculate_total:discount_within_limit
    type: soft
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: >-
      LLM-as-judge counterpart to `calculate_total:discount_within_limit`. Denies
      calculate_total invocations whose `discount_percent` exceeds the 30%
      cap — the parallel hard rule stays as a flag-only observability
      shadow for later comparison against the judge.
    judge_prompt: |
      You are auditing a discount applied to an order total.

      Rule: the maximum permitted discount is 30 percent. If the
      `discount_percent` field in the tool call exceeds 30, the call
      violates policy.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the discount_percent value>"}}
    user_template: |
      calculate_total tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_check_inventory:order_status
    type: soft
    version: v1
    tools:
      - check_inventory
    effect: deny
    description: >-
      LLM-as-judge counterpart to `check_inventory:order_status`. Only allow
      `check_inventory` when the order is currently in status `pending`.
    judge_prompt: |
      You are auditing an inventory-check tool call in a coffee shop order
      lifecycle.

      Rule: `check_inventory` may ONLY be called while the target order's
      current status is exactly "pending". Any other status (including
      empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      check_inventory tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_update_stock:order_status
    type: soft
    version: v1
    tools:
      - update_stock
    effect: deny
    description: >-
      LLM-as-judge counterpart to `update_stock:order_status`. Only allow
      `update_stock` when the order status is `inventory_confirmed`.
    judge_prompt: |
      You are auditing a stock-update tool call in a coffee shop order
      lifecycle.

      Rule: `update_stock` may ONLY be called while the target order's
      current status is exactly "inventory_confirmed". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      update_stock tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_start_preparation:order_status
    type: soft
    version: v1
    tools:
      - start_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `start_preparation:order_status`. Allow
      `start_preparation` only when the order status is one of:
      inventory_confirmed, in_preparation, or preparation_error (the latter
      two support retries of a failed brew).
    judge_prompt: |
      You are auditing a brew-start tool call in a coffee shop order
      lifecycle.

      Rule: `start_preparation` may ONLY be called while the target
      order's current status is one of:
        - "inventory_confirmed"
        - "in_preparation"
        - "preparation_error"
      Any other status (including empty / unknown / missing) means the
      call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      start_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_end_preparation:order_status
    type: soft
    version: v1
    tools:
      - end_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `end_preparation:order_status`. Only allow
      `end_preparation` when the order status is `in_preparation`.
    judge_prompt: |
      You are auditing a brew-completion tool call in a coffee shop order
      lifecycle.

      Rule: `end_preparation` may ONLY be called while the target order's
      current status is exactly "in_preparation". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      end_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_offer_refund:order_status
    type: soft
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: >-
      LLM-as-judge counterpart to `offer_refund:order_status`. Only allow
      `offer_refund` when the order status is `completed`.
    judge_prompt: |
      You are auditing a refund tool call in a coffee shop order
      lifecycle.

      Rule: `offer_refund` may ONLY be called while the target order's
      current status is exactly "completed". Any other status (including
      empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      offer_refund tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_process_order:max_calls
    type: soft
    version: v1
    tools:
      - process_order
    effect: deny
    description: >-
      LLM-as-judge counterpart to `process_order:max_calls`. Denies a
      second (or later) call to `process_order` within the same
      conversation.
    judge_prompt: |
      You are auditing a `process_order` tool call in a coffee shop
      multi-agent system.

      Rule: `process_order` may be called at most ONCE per conversation.
      If the conversation transcript already contains a prior successful
      call to `process_order`, this call MUST be denied.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason: prior process_order call at ...>"}}
    user_template: |
      process_order tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation
