guardrails:
  - id: allowed_handover_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: Handover target must be in the calling agent's allowed_handovers list.
    predicate: allowed_handover_targets

  - id: discount_within_30pct
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: Flag (do not block) calculate_total invocations with discount_percent above the configured limit.
    predicate: discount_within_limit
    predicate_args:
      max_pct: 30

  - id: handover_appropriateness_soft_stub
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: allow
    description: Stub soft guardrail asking 'is this handover appropriate?' (always allow for MVP).
    judge_prompt: Is the proposed handover appropriate given conversation state and guidelines?
    state_dependencies:
      - conversation

  # --- NeMo Guardrails (spike) -------------------------------------------------
  # LLM-based rails run through NeMo's validation-only LLMRails.check(), backed by
  # the agents' own LLM. Config: config/setups/nemo/nemo/{config.yml,prompts.yml}.
  - id: nemo_input_safety
    type: nemo
    version: v1
    stage: pre_call
    tools: []
    effect: deny
    description: >-
      NeMo input rail (self check input) on the customer request + tool args
      before an order is processed. Blocks off-topic, unsafe, or jailbreak input.
    config: nemo
    rails:
      - input

  - id: nemo_output_safety
    type: nemo
    version: v1
    stage: on_output
    effect: deny
    description: >-
      NeMo output rail (self check output) on the agent's final reply. Blocks
      replies that leak internals or are unsafe / off-topic.
    config: nemo
    rails:
      - output
