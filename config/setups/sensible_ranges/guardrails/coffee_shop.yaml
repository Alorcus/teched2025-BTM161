guardrails:
  - id: handover:allowed_targets
    type: hard
    version: v1
    tools: [transfer_to_agent]
    effect: deny
    description: Handover target must be in the calling agent's allowed_handovers list.
    predicate: allowed_handover_targets

  # Sensible range governance (deny): normal orders pass, only outliers are blocked.
  - id: create_order:size_within_range
    type: hard
    version: v1
    tools: [process_order]
    effect: deny
    description: Order size must be between 1 and 6 units (summed quantities).
    predicate: order_size_within_range
    predicate_args: {min_units: 1, max_units: 6, effect: deny}

  - id: create_order:total_within_limit
    type: hard
    version: v1
    tools: [calculate_total]
    effect: deny
    description: Order total must not exceed $20.
    predicate: order_total_within_limit
    predicate_args: {max_total: 20, effect: deny}

  - id: calculate_total:discount_within_limit
    type: hard
    version: v1
    tools: [calculate_total]
    effect: deny
    description: Discounts above 30% are not allowed.
    predicate: discount_within_limit
    predicate_args: {max_pct: 30, effect: deny}

  - id: offer_partial_refund:within_limit
    type: hard
    version: v1
    tools: [offer_partial_refund]
    effect: deny
    description: Partial refunds above 50% are not allowed.
    predicate: refund_within_limit
    predicate_args: {max_pct: 50, effect: deny}

  - id: offer_refund:within_limit
    type: hard
    version: v1
    tools: [offer_refund]
    effect: deny
    description: Full refund percent must not exceed 100%.
    predicate: refund_within_limit
    predicate_args: {max_pct: 100, effect: deny}

  - id: process_order:max_calls
    type: hard
    version: v1
    tools: [process_order]
    effect: deny
    description: process_order may be called at most 3 times per conversation.
    predicate: max_tool_calls
    predicate_args: {tool_name: process_order, max_calls: 3, effect: deny}

  - id: calculate_total:max_calls
    type: hard
    version: v1
    tools: [calculate_total]
    effect: deny
    description: calculate_total may be called at most 5 times per conversation.
    predicate: max_tool_calls
    predicate_args: {tool_name: calculate_total, max_calls: 5, effect: deny}

  - id: offer_refund:max_calls
    type: hard
    version: v1
    tools: [offer_refund]
    effect: deny
    description: offer_refund may be called at most twice per conversation.
    predicate: max_tool_calls
    predicate_args: {tool_name: offer_refund, max_calls: 2, effect: deny}

  - id: offer_partial_refund:max_calls
    type: hard
    version: v1
    tools: [offer_partial_refund]
    effect: deny
    description: offer_partial_refund may be called at most twice per conversation.
    predicate: max_tool_calls
    predicate_args: {tool_name: offer_partial_refund, max_calls: 2, effect: deny}

  - id: clean_machine:max_calls
    type: hard
    version: v1
    tools: [clean_machine]
    effect: deny
    description: clean_machine may be called at most 3 times per conversation.
    predicate: max_tool_calls
    predicate_args: {tool_name: clean_machine, max_calls: 3, effect: deny}

  - id: start_preparation:max_calls
    type: hard
    version: v1
    tools: [start_preparation]
    effect: deny
    description: start_preparation may be called at most 3 times per conversation.
    predicate: max_tool_calls
    predicate_args: {tool_name: start_preparation, max_calls: 3, effect: deny}

  # Order lifecycle (deny) — normal source preconditions, as in baseline.
  - id: check_inventory:order_status
    type: hard
    version: v1
    tools: [check_inventory]
    effect: deny
    description: check_inventory may only run while the order is pending.
    predicate: require_order_status
    predicate_args: {allowed: [pending], effect: deny}

  - id: update_stock:order_status
    type: hard
    version: v1
    tools: [update_stock]
    effect: deny
    description: update_stock may only run once inventory is confirmed.
    predicate: require_order_status
    predicate_args: {allowed: [inventory_confirmed], effect: deny}

  - id: start_preparation:order_status
    type: hard
    version: v1
    tools: [start_preparation]
    effect: deny
    description: start_preparation needs a confirmed order (or a prior prep to retry).
    predicate: require_order_status
    predicate_args: {allowed: [inventory_confirmed, in_preparation, preparation_error], effect: deny}

  - id: end_preparation:order_status
    type: hard
    version: v1
    tools: [end_preparation]
    effect: deny
    description: end_preparation may only run while a coffee is in preparation.
    predicate: require_order_status
    predicate_args: {allowed: [in_preparation], effect: deny}

  - id: offer_refund:order_status
    type: hard
    version: v1
    tools: [offer_refund]
    effect: deny
    description: offer_refund may only run on a completed order.
    predicate: require_order_status
    predicate_args: {allowed: [completed], effect: deny}
