# soft_baseline: every hard guardrail from `baseline` is reimplemented as a soft
# (LLM-as-judge) guardrail with the same effect intent. The original hard rules
# are kept as observability shadows — flipped to `effect: flag` so they still
# evaluate and log, but the soft judges are the ones that actually block. This
# lets us compare deterministic vs. LLM-judge decisions on the same traces.
#
# Effect mapping:
#   baseline hard rule (deny)  → hard rule flag + soft judge deny
#   baseline hard rule (flag)  → hard rule flag + soft judge flag (mirror intent)
guardrails:
  # -----------------------------------------------------------------------
  # HARD SHADOWS — every baseline hard rule kept, forced to `effect: flag`.
  # -----------------------------------------------------------------------
  - id: allowed_handover_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: Baseline hard rule kept as observability shadow (flag-only). Enforcement moves to soft_allowed_handover_targets.
    predicate: allowed_handover_targets
    predicate_args:
      effect: flag

  - id: discount_within_30pct
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: Flag (do not block) calculate_total invocations with discount_percent above the configured limit. Mirrors baseline.
    predicate: discount_within_limit
    predicate_args:
      max_pct: 30

  - id: gate_check_inventory
    type: hard
    version: v1
    tools:
      - check_inventory
    effect: flag
    description: Baseline shadow — flag only. Enforcement moves to soft_gate_check_inventory.
    predicate: require_order_status
    predicate_args:
      allowed: [pending]
      effect: flag

  - id: gate_update_stock
    type: hard
    version: v1
    tools:
      - update_stock
    effect: flag
    description: Baseline shadow — flag only. Enforcement moves to soft_gate_update_stock.
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed]
      effect: flag

  - id: gate_start_preparation
    type: hard
    version: v1
    tools:
      - start_preparation
    effect: flag
    description: Baseline shadow — flag only. Enforcement moves to soft_gate_start_preparation.
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed, in_preparation, preparation_error]
      effect: flag

  - id: gate_end_preparation
    type: hard
    version: v1
    tools:
      - end_preparation
    effect: flag
    description: Baseline shadow — flag only. Enforcement moves to soft_gate_end_preparation.
    predicate: require_order_status
    predicate_args:
      allowed: [in_preparation]
      effect: flag

  - id: gate_offer_refund
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: flag
    description: Baseline shadow — flag only. Enforcement moves to soft_gate_offer_refund.
    predicate: require_order_status
    predicate_args:
      allowed: [completed]
      effect: flag

  # -----------------------------------------------------------------------
  # OFF-MENU — the original soft guardrail, kept verbatim from baseline.
  # -----------------------------------------------------------------------
  - id: off_menu_recommendation
    type: soft
    version: v1
    tools:
      - assistant_message
    effect: deny
    description: >-
      LLM-as-judge that rejects any outgoing assistant message which
      recommends, offers, or otherwise proposes an item that is not on the
      coffee shop menu. Menu adherence is checked against the current MENU
      keys plus ALLOWED_EXTRAS (both injected into the judge prompt).
    judge_prompt: |
      You are a strict menu-adherence auditor for a coffee shop assistant.

      MENU (only these items are available):
      {menu}

      ALLOWED EXTRAS / MODIFIERS:
      {allowed_extras}

      Your task: read the assistant's OUTGOING message to the customer and
      decide whether it recommends, offers, suggests, promises, or otherwise
      proposes any drink, food, or menu item that is NOT on the MENU (with
      optional ALLOWED EXTRAS as modifiers).

      Rules:
      - The assistant MAY talk about menu items freely.
      - The assistant MAY politely decline items that are not on the menu
        (e.g. "we do not serve mocha"). Declining an off-menu item is not
        itself an off-menu recommendation.
      - The assistant MUST NOT invent, hallucinate, or upsell items that
        are not on the MENU. Examples of violations:
          * "How about a hazelnut latte?" (hazelnut is not an allowed extra)
          * "We recommend our caramel macchiato." (macchiato is not on the menu)
          * "You might enjoy a matcha frappé." (matcha, frappé — off menu)
      - Combinations of MENU items and ALLOWED EXTRAS are acceptable
        (e.g. "latte with oat milk", "americano with an extra shot").

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason mentioning the off-menu item(s)>"}}

      The reason will be shown to the assistant so it can revise. Keep it
      short (one sentence) and actionable.
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies:
      - conversation

  - id: handover_appropriateness_soft_stub
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: allow
    description: Stub soft guardrail asking 'is this handover appropriate?' (always allow for MVP). Kept from baseline for parity.
    judge_prompt: Is the proposed handover appropriate given conversation state and guidelines?
    state_dependencies:
      - conversation

  # -----------------------------------------------------------------------
  # SOFT COUNTERPARTS — LLM-as-judge reimplementations of every baseline hard
  # rule. `effect` mirrors the baseline hard rule's original intent (deny for
  # baseline's deny rules, flag for baseline's flag-only rules).
  # -----------------------------------------------------------------------
  - id: soft_allowed_handover_targets
    type: soft
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: >-
      LLM-as-judge counterpart to `allowed_handover_targets`. Rejects a
      handover whose `target_agent` is not in the calling agent's declared
      `allowed_handovers` list.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system.

      Calling agent: {agent_id}
      Agents that {agent_id} is allowed to hand off to: {allowed_handovers}

      Rules:
      - A handover is ALLOWED if and only if the proposed `target_agent`
        appears verbatim in the allowed list above.
      - If the allowed list is "(none)" the handover MUST be denied.
      - Be strict: do not accept fuzzy matches, aliases, or agents that
        merely sound similar. Exact string match only.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason naming the target and the allowed list>"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_discount_within_30pct
    type: soft
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: >-
      LLM-as-judge counterpart to `discount_within_30pct`. Mirrors the
      baseline effect (flag only) — it does not block, only labels
      violations for later comparison against the hard predicate.
    judge_prompt: |
      You are auditing a discount applied to an order total.

      Rule: the maximum permitted discount is 30 percent. If the
      `discount_percent` field in the tool call exceeds 30, the call
      violates policy.

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the discount_percent value>"}}
    user_template: |
      calculate_total tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - conversation

  - id: soft_gate_check_inventory
    type: soft
    version: v1
    tools:
      - check_inventory
    effect: deny
    description: >-
      LLM-as-judge counterpart to `gate_check_inventory`. Only allow
      `check_inventory` when the order is currently in status `pending`.
    judge_prompt: |
      You are auditing an inventory-check tool call in a coffee shop order
      lifecycle.

      Rule: `check_inventory` may ONLY be called while the target order's
      current status is exactly "pending". Any other status (including
      empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      check_inventory tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_gate_update_stock
    type: soft
    version: v1
    tools:
      - update_stock
    effect: deny
    description: >-
      LLM-as-judge counterpart to `gate_update_stock`. Only allow
      `update_stock` when the order status is `inventory_confirmed`.
    judge_prompt: |
      You are auditing a stock-update tool call in a coffee shop order
      lifecycle.

      Rule: `update_stock` may ONLY be called while the target order's
      current status is exactly "inventory_confirmed". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      update_stock tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_gate_start_preparation
    type: soft
    version: v1
    tools:
      - start_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `gate_start_preparation`. Allow
      `start_preparation` only when the order status is one of:
      inventory_confirmed, in_preparation, or preparation_error (the latter
      two support retries of a failed brew).
    judge_prompt: |
      You are auditing a brew-start tool call in a coffee shop order
      lifecycle.

      Rule: `start_preparation` may ONLY be called while the target
      order's current status is one of:
        - "inventory_confirmed"
        - "in_preparation"
        - "preparation_error"
      Any other status (including empty / unknown / missing) means the
      call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      start_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_gate_end_preparation
    type: soft
    version: v1
    tools:
      - end_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `gate_end_preparation`. Only allow
      `end_preparation` when the order status is `in_preparation`.
    judge_prompt: |
      You are auditing a brew-completion tool call in a coffee shop order
      lifecycle.

      Rule: `end_preparation` may ONLY be called while the target order's
      current status is exactly "in_preparation". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      end_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_gate_offer_refund
    type: soft
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: >-
      LLM-as-judge counterpart to `gate_offer_refund`. Only allow
      `offer_refund` when the order status is `completed`.
    judge_prompt: |
      You are auditing a refund tool call in a coffee shop order
      lifecycle.

      Rule: `offer_refund` may ONLY be called while the target order's
      current status is exactly "completed". Any other status (including
      empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE:
        {{"decision": "allow", "reason": ""}}
      or
        {{"decision": "deny", "reason": "<short reason quoting the current status>"}}
    user_template: |
      offer_refund tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order
